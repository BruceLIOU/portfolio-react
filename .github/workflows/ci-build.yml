name: Verify portfolio build

on:
  push:
    branches:
      - chore/o2switch-deploy-pipeline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check static artifact
        run: test -f build/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-build-${{ github.sha }}
          path: build/
          retention-days: 7
