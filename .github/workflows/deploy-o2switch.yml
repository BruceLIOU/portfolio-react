name: Deploy portfolio to o2switch

on:
  workflow_dispatch:

concurrency:
  group: portfolio-o2switch-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.O2SWITCH_PORTFOLIO_DEPLOY_KEY }}
          O2SWITCH_HOST: ${{ vars.O2SWITCH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/o2switch_portfolio
          chmod 600 ~/.ssh/o2switch_portfolio
          ssh-keyscan -H "$O2SWITCH_HOST" >> ~/.ssh/known_hosts
      - name: Upload and atomically activate release
        env:
          O2SWITCH_HOST: ${{ vars.O2SWITCH_HOST }}
          O2SWITCH_USER: ${{ vars.O2SWITCH_USER }}
          DEPLOY_PATH: /home/grhw2384/public_html/portfolio-react
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE="$O2SWITCH_USER@$O2SWITCH_HOST"
          ssh -i ~/.ssh/o2switch_portfolio "$REMOTE" "mkdir -p '$DEPLOY_PATH/releases/$RELEASE_ID' '$DEPLOY_PATH/backups'"
          rsync -az --delete -e 'ssh -i ~/.ssh/o2switch_portfolio' build/ "$REMOTE:$DEPLOY_PATH/releases/$RELEASE_ID/"
          ssh -i ~/.ssh/o2switch_portfolio "$REMOTE" "set -e; test -f '$DEPLOY_PATH/releases/$RELEASE_ID/index.html'; if [ -d '$DEPLOY_PATH/build' ]; then tar -C '$DEPLOY_PATH' -czf '$DEPLOY_PATH/backups/build-$(date +%Y%m%d%H%M%S).tgz' build; mv '$DEPLOY_PATH/build' '$DEPLOY_PATH/build.previous'; fi; mv '$DEPLOY_PATH/releases/$RELEASE_ID' '$DEPLOY_PATH/build'; rm -rf '$DEPLOY_PATH/build.previous'"
      - name: Smoke test
        run: curl --fail --retry 3 --retry-delay 3 https://www.bruceliou.fr/
