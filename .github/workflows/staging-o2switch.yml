name: Deploy non-public staging copy

on:
  push:
    branches: [chore/o2switch-deploy-pipeline]
  workflow_dispatch:

concurrency:
  group: portfolio-o2switch-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: test -f build/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: staging-build-${{ github.sha }}
          path: build/
          retention-days: 7
  deploy:
    needs: build
    runs-on: [self-hosted, linux, arm64, o2switch-deploy]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staging-build-${{ github.sha }}
          path: build
      - name: Deploy isolated artifact
        env:
          O2SWITCH_HOST: ${{ vars.O2SWITCH_HOST }}
          O2SWITCH_USER: ${{ vars.O2SWITCH_USER }}
          STAGING_PATH: /home/grhw2384/staging/portfolio-react
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE="$O2SWITCH_USER@$O2SWITCH_HOST"
          ssh -i /home/hermes/.hermes/profiles/pro/deploy/o2switch_portfolio_ed25519 "$REMOTE" "mkdir -p '$STAGING_PATH/$RELEASE_ID'"
          rsync -az --delete -e 'ssh -i /home/hermes/.hermes/profiles/pro/deploy/o2switch_portfolio_ed25519' build/ "$REMOTE:$STAGING_PATH/$RELEASE_ID/"
          ssh -i /home/hermes/.hermes/profiles/pro/deploy/o2switch_portfolio_ed25519 "$REMOTE" "test -f '$STAGING_PATH/$RELEASE_ID/index.html'"
